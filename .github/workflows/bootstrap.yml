name: Bootstrap upstream Windows base

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import natpate/ninfer-windows
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git clone --depth 1 https://github.com/natpate/ninfer-windows.git "$workdir/upstream"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/bootstrap.yml' \
            "$workdir/upstream/" ./
          git status --short

      - name: Commit imported base
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The upstream .gitignore contains "models/" for downloaded model
          # artifacts, which also matches the source directory src/models.
          # Force-add the actual source tree so it is not silently omitted.
          git add -f src/models
          git commit -m "Import natpate/ninfer-windows base" || exit 0
          git push
